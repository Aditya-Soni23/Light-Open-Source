services:
  - type: web
    name: light-voice-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: light-3dc69
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ACCESS_CONTROL_ALLOW_ORIGIN
        value: "*"
